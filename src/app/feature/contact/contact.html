<div class="contact flex justify-content-evenly gap-6">
    <div class="contact__details flex flex-column gap-2">
        <div class="contact__details__title flex flex-column justify-content-center align-items-center">
            <img src="assets/logo.png" alt="" class="w-10rem h-10rem">
            <div class="p-0 m-0">
                <h1 class="p-0 m-0 text-center">KnowVista</h1>
                <p class="p-0 m-0"> <b>Where knowledge meets conversation</b></p>
                <div class="contact__details__title__info text-center">
                    <p>info@KnowVista.com</p>
                    <p> +91 8957178424</p>
                </div>
            </div>
        </div>
    </div>
    <div class="flex flex-column">
        <div class="contact-form">
            <h2 class="contact-form__title">Contact Us</h2>
            <form class="contact-form__body">
              <div class="contact-form__group">
                <label class="contact-form__label">Title</label>
                <input type="text" class="contact-form__input" placeholder="Enter title">
              </div>
              <div class="contact-form__group">
                <label class="contact-form__label">Name</label>
                <input type="text" class="contact-form__input" placeholder="Enter your name">
              </div>
              <div class="contact-form__group">
                <label class="contact-form__label">Mobile Number</label>
                <input type="tel" class="contact-form__input" placeholder="Enter mobile number">
              </div>
              <div class="contact-form__group">
                <label class="contact-form__label">Description</label>
                <textarea class="contact-form__textarea" rows="4" placeholder="Enter description"></textarea>
              </div>
              <div class="contact-form__actions">
                <button type="submit" class="contact-form__button contact-form__button--send">
                  Send
                </button>
                <button type="reset" class="contact-form__button contact-form__button--reset">
                  Reset
                </button>
              </div>
            </form>
          </div>
    </div>
</div>
