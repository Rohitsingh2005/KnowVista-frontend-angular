<div class="footer">
    <div class="footer__container flex justify-content-between align-items-center">
        <div class="footer__container__left flex align-items-top gap-2 flex-column">
            <div class="flex align-items-center">
            <img src="assets/logo.png" alt="logo" class="w-4rem h-4rem">
            <h1 class="m-0">KnowVista</h1>
            </div>
            <div class="footer__container__left__description">
                Where knowledge meets conversation
            </div>
        </div>
        <div class="footer__container__right flex align-items-center gap-1 flex-column">
            <div>
                <h3 class="bold">Quick Links</h3>
            </div>
            <ul class="footer__container__right__list list-none p-0 m-0">
               <li *ngFor="let link of navbarLinks" class="footer__container__right__list__item p-1">
                <a [routerLink]="link.href" routerLinkActive="active" [routerLinkActiveOptions]="{exact: link.href === '/'}">{{ link.label }}</a>
                </li>
            </ul>
        </div>
        <div class="footer__container__social flex flex-column gap-2">
            <h3>Contact Us</h3>
            <div class="footer__container__social__contact flex flex-column gap-3">
                <li class="pi pi-inbox"> info@knowvista.com</li>
                <li class="pi pi-phone"> +91 8957179424</li>
            </div>
            <div class="footer__container__social__icons flex gap-3 mt-2">
                <a href="#" class="pi pi-facebook text-2xl"></a>
                <a href="#" class="pi pi-linkedin text-2xl"></a>
                <a href="#" class="pi pi-instagram text-2xl"></a>
                <a href="#" class="pi pi-github text-2xl"></a>
            </div>
        </div>
    </div>  
    <hr>
    <div class="m-0 p-1 text-center ">
        <h3>
            © 2026 KnowVista. All rights reserved.
        </h3>
    </div>
</div>
