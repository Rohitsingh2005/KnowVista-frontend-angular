<div class="login flex flex-column justify-content-center align-items-center">
    <div class="login__container">
        <div class="login__header flex flex-column align-items-center">
            <img src="assets/logo.png" alt="KnowVista" class="login__header__image" />
            <h1 class="login__header__title">KnowVista</h1>
            <p class="login__header__subtitle">Welcome back! Please login to your account.</p>
        </div>
        
        <div class="login__form">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
                <div class="login__form__group">
                    <div class="login__form__input-wrapper">
                        <i class="pi pi-envelope login__form__icon login__form__icon--left"></i>
                        <input 
                            type="email" 
                            formControlName="email"
                            placeholder="Enter Your Email"
                            class="login__form__input"
                            [class.login__form__input--error]="email?.invalid && email?.touched"
                            autocomplete="email"
                        />
                    </div>
                    <div class="login__form__error" *ngIf="email?.invalid && email?.touched">
                        <span *ngIf="email?.errors?.['required']">Email is required</span>
                        <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
                    </div>
                </div>

                <div class="login__form__group">
                    <div class="login__form__input-wrapper">
                        <i class="pi pi-lock login__form__icon login__form__icon--left"></i>
                        <input 
                            [type]="showPassword ? 'text' : 'password'"
                            formControlName="password"
                            placeholder="Enter Your Password"
                            class="login__form__input"
                            [class.login__form__input--error]="password?.invalid && password?.touched"
                            autocomplete="current-password"
                        />
                        <i 
                            [class]="showPassword ? 'pi pi-eye login__form__icon login__form__icon--right' : 'pi pi-eye-slash login__form__icon login__form__icon--right'"
                            (click)="togglePasswordVisibility()"
                            role="button"
                            tabindex="0"
                            (keydown.enter)="togglePasswordVisibility()"
                        ></i>
                    </div>
                    <div class="login__form__error" *ngIf="password?.invalid && password?.touched">
                        <span *ngIf="password?.errors?.['required']">Password is required</span>
                        <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
                    </div>
                </div>

                <div class="login__form__actions">
                    <button 
                        type="submit" 
                        class="login__form__button login__form__button--primary"
                        [disabled]="isLoading || loginForm.invalid"
                    >
                        <span *ngIf="!isLoading">Login</span>
                        <span *ngIf="isLoading" class="login__form__button__loading">
                            <i class="pi pi-spin pi-spinner"></i>
                            Logging in...
                        </span>
                    </button>
                    <button 
                        type="button" 
                        class="login__form__button login__form__button--secondary"
                        (click)="onReset()"
                        [disabled]="isLoading"
                    >
                        Reset
                    </button>
                </div>
            </form>
            <p>New User ,<span routerLink="/register" class="cursor-pointer">   Click here to Register </span></p>
        </div>
    </div>
</div>
