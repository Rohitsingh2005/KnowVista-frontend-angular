<div class="login flex flex-column justify-content-center align-items-center">
    <div class="login__header flex flex-column align-items-center">
        <img src="assets/logo.png" alt="KnowVista" class="login__header__image p-0 m-0">
        <h1 class="login__header__title p-0 m-0">KnowVista</h1>
    </div>
    <div class="login__form">
        <form action="">
            <div>
                <input type="text" placeholder="Enter Your Email">
                <i class="pi pi-inbox login__form__icons"></i>
            </div>
            <div>
                <input type="password" placeholder="Enter Your Password">
                <i class="pi pi-eye-slash login__form__icons"></i>
            </div>
            <div class="flex gap-2">
                <button type="submit">Login</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
</div>
